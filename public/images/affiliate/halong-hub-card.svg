<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Ha Long Bay cruise illustration</title>
<desc id="desc">Stylised limestone karsts, emerald water and a cruise boat inspired by Ha Long Bay.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff3f0"/>
    <stop offset="1" stop-color="#f6ead5"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6aa69a"/>
    <stop offset="1" stop-color="#2f746a"/>
  </linearGradient>
  <linearGradient id="karst" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#315f51"/>
    <stop offset="1" stop-color="#173f36"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#173f36" flood-opacity=".2"/>
  </filter>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="930" cy="150" r="58" fill="#fff7df" opacity=".95"/>
<path d="M0 390 C120 330 170 340 230 380 C310 280 390 260 455 350 C520 250 625 215 700 340 C775 255 860 280 920 365 C1010 310 1090 325 1200 390 L1200 800 L0 800 Z" fill="#7aa798" opacity=".42"/>
<path d="M40 430 C120 350 175 320 250 420 C315 275 390 250 465 415 C545 300 625 300 690 430 C760 340 840 345 900 430 C980 360 1070 360 1160 430 L1160 585 L40 585 Z" fill="url(#karst)"/>
<path d="M0 500 C140 475 280 515 420 492 C560 470 700 515 840 492 C980 470 1090 505 1200 485 L1200 800 L0 800 Z" fill="url(#water)"/>
<g opacity=".35" stroke="#e7f4ef" stroke-width="5">
  <path d="M40 620 C200 595 350 635 520 612"/>
  <path d="M610 670 C770 645 945 680 1130 650"/>
  <path d="M160 735 C325 710 470 745 620 725"/>
</g>
<g transform="translate(690 420)" filter="url(#shadow)">
  <path d="M0 180 L300 180 L265 235 L45 235 Z" fill="#f4eee1"/>
  <rect x="58" y="105" width="190" height="78" rx="8" fill="#fffaf0"/>
  <rect x="88" y="62" width="130" height="45" rx="7" fill="#f6f0e4"/>
  <rect x="145" y="5" width="10" height="58" fill="#203e35"/>
  <path d="M150 10 L230 40 L150 40 Z" fill="#d86a4b"/>
  <g fill="#244a40">
    <rect x="80" y="125" width="34" height="24" rx="3"/>
    <rect x="130" y="125" width="34" height="24" rx="3"/>
    <rect x="180" y="125" width="34" height="24" rx="3"/>
  </g>
</g>
<rect x="60" y="60" width="315" height="112" rx="28" fill="#0f3c32" opacity=".93"/>
<text x="95" y="110" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#d6eadf" letter-spacing="2">HA LONG BAY</text>
<text x="95" y="149" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Dagstur fra Hanoi</text>
</svg>